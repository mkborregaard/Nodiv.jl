name: Format
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  format:
    name: BlueStyle (JuliaFormatter)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      # The JuliaFormatter version is pinned so CI formats exactly like a local run;
      # raise it deliberately (and reformat) rather than letting it drift.
      - name: Check formatting
        shell: julia --color=yes {0}
        run: |
          using Pkg
          Pkg.activate(; temp=true)
          Pkg.add(; name="JuliaFormatter", version="2.14")
          using JuliaFormatter
          if !format(".")
              run(`git --no-pager diff`)
              error("Files are not BlueStyle-formatted; run `JuliaFormatter.format(\".\")`")
          end
